# Backend + Redis. Start from the backend/ folder:
#   docker compose up -d --build
#
# The API is only reachable from the server itself (127.0.0.1). The reverse
# proxy (HTTPS) forwards cuisine-api.franekkaminski.dev to it.

name: code-a-cuisine

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # The port is bound to 127.0.0.1 only, so every request comes through
      # the local reverse proxy and its X-Forwarded-For header can be trusted.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    # Embedding model + vector index need a bit more memory than plain FastAPI.
    mem_limit: 1g

  # Remote MCP server (Streamable HTTP) for AI assistants. Same image, own process.
  # Caddy forwards https://<domain>/mcp to it. Needs MCP_API_KEYS and
  # MCP_ALLOWED_HOSTS (your domain) in .env.
  mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      FORWARDED_ALLOW_IPS: "*"
    command: ["uvicorn", "mcp_server.http:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--no-access-log"]
    ports:
      - "127.0.0.1:${MCP_PORT:-8003}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 768m

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Only rate-limit counters live here: small memory cap, no disk snapshots.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
