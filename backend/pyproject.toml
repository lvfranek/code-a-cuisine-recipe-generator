[project]
name = "code-a-cuisine-backend"
version = "0.1.0"
description = "Python backend for Code a Cuisine (FastAPI, RAG, agents, MCP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
